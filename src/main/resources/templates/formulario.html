<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1 th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'">Formulario</h1>
    
    <form th:action="@{/inventario/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Nombre del Producto:</label>
            <input type="text" th:field="*{nombre}" required placeholder="Ej. Monitor 27 Pulgadas" />
        </div>

        <div class="form-group">
            <label>Precio ($):</label>
            <input type="number" step="0.01" th:field="*{precio}" required placeholder="Ej. 3500.50" />
        </div>

        <div class="form-group">
            <label>Categoría:</label>
            <select th:field="*{categoria}" required>
                <option value="">-- Selecciona una Categoría --</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
            </select>
        </div>

        <button type="submit">Guardar en MySQL</button>
        <a th:href="@{/inventario}" style="margin-left: 15px; color: #666;">Cancelar</a>
    </form>
</body>
</html>
