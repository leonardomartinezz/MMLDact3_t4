<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario con MySQL y Relaciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 8px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn-danger { background-color: #dc3545; }
        .btn-warning { background-color: #ffc107; color: black; }
    </style>
</head>
<body>
    <h1>Almacén: Listado de Productos (Conectado a MySQL)</h1>
    <a th:href="@{/inventario/nuevo}" class="btn">+ Agregar Nuevo Producto</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Producto</th>
                <th>Precio ($)</th>
                <th>Categoría (Relación ManyToOne)</th>
                <th>Acciones (Editar / Eliminar)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.id}">1</td>
                <td th:text="${prod.nombre}">Laptop</td>
                <td th:text="${prod.precio}">15000.00</td>
                <td th:text="${prod.categoria.nombre}">Electrónica</td>
                <td>
                    <a th:href="@{/inventario/editar/{id}(id=${prod.id})}" class="btn btn-warning"> Editar</a>
                    <a th:href="@{/inventario/eliminar/{id}(id=${prod.id})}" class="btn btn-danger" onclick="return confirm('¿Seguro que deseas eliminarlo?');">🗑️ Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
